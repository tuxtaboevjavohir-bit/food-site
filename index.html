<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food house — штаб агентов</title>
<style>
  :root{--bg:#1b1410;--panel:#261c16;--line:#3a2b21;--txt:#f5ece4;--mute:#b39f8f;--acc:#ff8a2b;--ok:#5cc98a}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
  header h1{font-size:20px;margin:0}
  header h1 span{color:var(--acc)}
  .badge{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--mute)}
  .badge.demo{background:#5a3a12;color:#ffd29b}
  nav{margin-left:auto;display:flex;gap:6px}
  nav button{background:none;border:1px solid var(--line);color:var(--mute);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:14px}
  nav button.on{background:var(--acc);border-color:var(--acc);color:#1b1410;font-weight:600}
  main{padding:20px 22px;max-width:1200px;margin:0 auto}
  .tab{display:none}.tab.on{display:block}

  /* --- офис --- */
  #office{position:relative;width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#120d0a}
  #floor{position:absolute;left:0;top:0;width:1200px;height:720px;transform-origin:0 0}
  .corridor{position:absolute;left:0;top:300px;width:900px;height:120px;
    background:repeating-linear-gradient(90deg,#4a3f36 0 40px,#453a32 40px 80px)}
  .room{position:absolute;border:5px solid #d9c9b6;box-sizing:border-box}
  .room .plate{position:absolute;left:8px;top:6px;font-size:12px;font-weight:600;color:#f5ece4;background:#0007;padding:3px 8px;border-radius:6px;z-index:900}
  .door{position:absolute;background:#4a3f36;z-index:2}
  .door::after{content:"";position:absolute;width:4px;height:44px;background:#8a5a34;border-radius:2px}
  .door.b::after{left:2px;top:-40px;transform:rotate(-30deg);transform-origin:bottom}
  .door.t::after{left:2px;top:3px;transform:rotate(30deg);transform-origin:top}
  .door.l::after{left:3px;top:2px;width:44px;height:4px;transform:rotate(-30deg);transform-origin:left}
  .decor{position:absolute;line-height:1;filter:drop-shadow(0 3px 2px #0006)}
  .wallart{position:absolute;border-radius:4px}
  .board{position:absolute;left:975px;top:40px;width:170px;height:95px;background:#f4f4f0;border:5px solid #9a7b5c;border-radius:4px;
    font:600 11px/1.45 system-ui;color:#2a4a8a;padding:6px 8px;overflow:hidden;z-index:5}
  .board b{color:#c0392b}
  .window{position:absolute;background:linear-gradient(180deg,#9fd3ff,#d8efff);border:4px solid #d9c9b6;border-radius:3px}

  .desk{position:absolute;height:36px}
  .desk .top{position:absolute;left:0;right:0;top:0;height:9px;background:#8a5a34;border-radius:3px;box-shadow:0 2px 0 #5e3c22}
  .desk .lg{position:absolute;top:9px;width:6px;height:27px;background:#5e3c22}
  .desk .lg.a{left:6px}.desk .lg.z{right:6px}
  .mon{position:absolute;top:-30px;width:36px;height:26px;background:#222;border:3px solid #444;border-radius:3px}
  .mon::after{content:"";position:absolute;left:12px;bottom:-9px;width:6px;height:6px;background:#444}
  .mon.on{background:#5aa9ff;box-shadow:0 0 14px #5aa9ff;animation:scr 1s infinite alternate}
  @keyframes scr{to{background:#8cc6ff}}
  .papers{position:absolute;top:-10px;font-size:14px}
  .chair{position:absolute;width:30px;height:40px}
  .chair::before{content:"";position:absolute;bottom:14px;left:0;width:30px;height:7px;background:#333;border-radius:3px}
  .chair::after{content:"";position:absolute;bottom:14px;width:7px;height:28px;background:#333;border-radius:3px}
  .chair.r::after{left:0}.chair.l::after{right:0}

  .person{position:absolute;width:40px;height:76px}
  .pi{position:absolute;inset:0}
  .person.left .pi{transform:scaleX(-1)}
  .pb{position:absolute;inset:0;transition:transform .3s}
  .pb > div{position:absolute}
  .head{left:10px;top:0;width:22px;height:22px;border-radius:50%;background:var(--skin);z-index:4}
  .hair{left:-1px;top:-2px;width:24px;height:11px;border-radius:12px 12px 3px 5px;background:var(--hair);position:absolute}
  .eye{right:4px;top:10px;width:3px;height:3px;border-radius:50%;background:#222;position:absolute}
  .torso{left:11px;top:21px;width:20px;height:27px;border-radius:7px 7px 4px 4px;background:var(--shirt);z-index:2}
  .arm{left:17px;top:23px;width:7px;height:23px;border-radius:4px;background:var(--shirt);transform-origin:50% 3px;transition:transform .25s}
  .arm::after{content:"";position:absolute;bottom:-4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--skin)}
  .arm.f{z-index:5;filter:brightness(.88)}.arm.b{z-index:1;filter:brightness(.6)}
  .leg{left:15px;top:46px;width:9px;height:27px;border-radius:4px;background:var(--pants);transform-origin:50% 3px;transition:transform .25s}
  .leg::after{content:"";position:absolute;bottom:-3px;left:-1px;width:13px;height:6px;border-radius:3px 7px 3px 3px;background:#1d1d1d}
  .leg.f{z-index:3}.leg.b{z-index:1;filter:brightness(.7)}
  .carry{left:24px;top:36px;font-size:16px;display:none;z-index:6}
  .person.carrying .carry{display:block}
  .tag{position:absolute;top:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;background:#000b;color:#fff;padding:1px 6px;border-radius:5px}
  .bubble{position:absolute;bottom:98px;left:50%;transform:translateX(-50%);width:210px;background:#fff;color:#222;
    font-size:12px;padding:7px 9px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;line-height:1.3}
  .bubble::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
  .bubble.show{opacity:1}

  /* ходьба */
  .walking .pb{animation:bob .26s infinite alternate}
  .walking .leg.f{animation:swing .52s infinite ease-in-out alternate}
  .walking .leg.b{animation:swing .52s infinite ease-in-out alternate-reverse}
  .walking .arm.f{animation:swing .52s infinite ease-in-out alternate-reverse}
  .walking .arm.b{animation:swing .52s infinite ease-in-out alternate}
  .walking.carrying .arm.f{animation:none;transform:rotate(-60deg)}
  @keyframes swing{from{transform:rotate(26deg)}to{transform:rotate(-26deg)}}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
  /* сидит */
  .sitting .pb{transform:translateY(9px)}
  .sitting .leg{transform:rotate(-82deg)}
  .sitting .arm{transform:rotate(-65deg)}
  .sitting.typing .arm.f{animation:tp .18s infinite alternate}
  .sitting.typing .arm.b{animation:tp .18s infinite alternate-reverse}
  @keyframes tp{from{transform:rotate(-65deg)}to{transform:rotate(-55deg)}}
  .typing .head{animation:nod 1.4s infinite ease-in-out}
  @keyframes nod{50%{transform:rotate(6deg)}}
  /* думает, пишет, отдаёт */
  .thinking .arm.f{transform:rotate(-155deg) translateY(-2px)!important;animation:none!important}
  .thinking .head{transform:rotate(-8deg)}
  .writing .arm.f{animation:wr .35s infinite alternate}
  @keyframes wr{from{transform:rotate(-140deg)}to{transform:rotate(-115deg)}}
  .giving .arm.f{transform:rotate(-90deg)!important;animation:none!important}
  .waving .arm.f{animation:wave .3s infinite alternate}
  @keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-180deg)}}
  .stretch .arm{transform:rotate(180deg)!important}

  .taskbox{display:flex;gap:10px;margin:16px 0}
  textarea,input[type=text]{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font:inherit;resize:vertical}
  button.main{background:var(--acc);color:#1b1410;border:0;border-radius:10px;padding:0 22px;font-weight:700;font-size:15px;cursor:pointer}
  button.main:disabled{opacity:.5;cursor:wait}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--mute);padding:6px 11px;border-radius:99px;font-size:13px;cursor:pointer}
  .chip:hover{color:var(--txt);border-color:var(--acc)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .card h3{margin:0 0 6px;font-size:15px}
  .card .task{color:var(--mute);font-size:13px;margin-bottom:8px}
  .card pre{white-space:pre-wrap;font-family:inherit;margin:0;line-height:1.5;font-size:14px}
  .card.summary{border-color:var(--acc)}
  .err{color:#ff8f8f}

  /* меню */
  .drop{border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--mute)}
  .drop.over{border-color:var(--acc);color:var(--txt)}
  .drop .btns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .drop label{background:var(--acc);color:#1b1410;font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer}
  .drop label.alt{background:var(--line);color:var(--txt)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
  .thumbs img{width:90px;height:90px;object-fit:cover;border-radius:8px}
  table{width:100%;border-collapse:collapse;margin-top:16px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
  th{color:var(--mute);font-weight:500}
  td.price{text-align:right;white-space:nowrap}
  .row{display:flex;gap:10px;align-items:center}
  .fact{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .fact button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px}
  small{color:var(--mute)}
  .md{line-height:1.55;font-size:14px}
  .md h1,.md h2,.md h3{margin:14px 0 6px;line-height:1.3}.md h1{font-size:18px}.md h2{font-size:16px}.md h3{font-size:15px}
  .md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:22px}.md li{margin:2px 0}
  .md table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13px;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  .md th{background:#33251c;color:var(--txt)}
  .md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  .md code{background:#33251c;padding:1px 5px;border-radius:4px}
  .md strong{color:#ffd29b}
  .copy{float:right;background:none;border:1px solid var(--line);color:var(--mute);border-radius:7px;padding:3px 9px;font-size:12px;cursor:pointer}
  .copy:hover{color:var(--txt);border-color:var(--acc)}
  .lang{display:inline-flex;margin-left:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .lang button{border:0!important;border-radius:0!important;padding:7px 10px!important}
  .lang button.on{background:#ffd29b;color:#1b1410}
  nav{flex-wrap:wrap}
  select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px}
  .switch{display:flex;align-items:center;gap:6px;color:var(--mute);cursor:pointer}
  .wa{display:grid;grid-template-columns:280px 1fr;gap:12px;min-height:420px}
  .wa-list,.wa-chat{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .wa-list{overflow-y:auto;max-height:560px}
  .wa-item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .wa-item:hover,.wa-item.on{background:#33251c}
  .wa-item b{display:block;font-size:14px}.wa-item small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wa-chat{display:flex;flex-direction:column}
  .wa-msgs{flex:1;padding:14px;overflow-y:auto;max-height:480px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:75%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.4;white-space:pre-wrap}
  .msg.in{background:#33251c;align-self:flex-start;border-bottom-left-radius:3px}
  .msg.out{background:#1f5c3a;align-self:flex-end;border-bottom-right-radius:3px}
  .msg small{display:block;font-size:11px;opacity:.7;margin-top:3px}
  .bars{display:flex;align-items:flex-end;gap:3px;height:180px;padding:10px 0;border-bottom:1px solid var(--line)}
  .bar{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-width:4px;position:relative}
  .bar:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:11px;padding:3px 6px;border-radius:5px;white-space:nowrap}
  .kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:160px}
  .kpi b{display:block;font-size:22px;color:#ffd29b}
  @media (max-width:760px){.wa{grid-template-columns:1fr}}
</style>

</head>
<body>
<header>
  <h1>🍔 Food <span>house</span> · <b data-i18n="title">штаб агентов</b></h1>
  <span id="mode" class="badge">…</span>
  <nav>
    <button data-tab="hq" class="on" data-i18n="tab_hq">Штаб</button>
    <button data-tab="sales" data-i18n="tab_sales">Продажи</button>
    <button data-tab="wa">WhatsApp</button>
    <button data-tab="menu" data-i18n="tab_menu">Меню</button>
    <button data-tab="mem" data-i18n="tab_mem">Память</button>
    <button data-tab="hist" data-i18n="tab_hist">История</button>
    <span class="lang"><button data-lang="ru">РУС</button><button data-lang="kk">ҚАЗ</button></span>
  </nav>
</header>

<main>
  <!-- ШТАБ -->
  <section id="hq" class="tab on">
    <div id="office"><div id="floor"></div></div>
    <div class="taskbox">
      <textarea id="taskText" rows="2" data-i18n-ph="task_ph" placeholder="Задача для команды"></textarea>
      <button id="sendBtn" class="main" data-i18n="send">Поручить</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="results"></div>
  </section>

  <!-- ПРОДАЖИ -->
  <section id="sales" class="tab">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:14px">
      <h2 style="margin:0" data-i18n="sales_h">Продажи из Paloma365</h2>
      <div class="row">
        <select id="salesDays"><option value="7">7</option><option value="30" selected>30</option><option value="92">92</option></select>
        <small data-i18n="days">дней</small>
        <button class="main" id="salesBtn" style="padding:8px 16px" data-i18n="refresh">Обновить</button>
      </div>
    </div>
    <div id="salesBox"></div>
  </section>

  <!-- WHATSAPP -->
  <section id="wa" class="tab">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:14px">
      <h2 style="margin:0" data-i18n="wa_h">Переписка с гостями</h2>
      <div class="row" style="flex-wrap:wrap">
        <label class="switch"><input type="checkbox" id="waAuto"> <span data-i18n="wa_auto">Автоответ ИИ</span></label>
        <button class="main" id="waIdeasBtn" style="padding:8px 16px" data-i18n="wa_ideas">💡 Идеи из переписки</button>
      </div>
    </div>
    <div id="waSetup"></div>
    <div id="waIdeas"></div>
    <div class="wa">
      <div class="wa-list" id="waList"></div>
      <div class="wa-chat">
        <div class="wa-msgs" id="waMsgs"><small data-i18n="wa_pick">Выберите чат слева</small></div>
        <div class="taskbox" style="margin:0;padding:10px">
          <input type="text" id="waText" data-i18n-ph="wa_ph" placeholder="Ответ гостю…">
          <button class="main" id="waSend" data-i18n="wa_send">Отправить</button>
        </div>
      </div>
    </div>
  </section>

  <!-- МЕНЮ -->
  <section id="menu" class="tab">
    <div id="drop" class="drop">
      <div style="font-size:40px">📷 📄</div>
      <div data-i18n="drop">Перетащите сюда фото или PDF меню, или выберите</div>
      <div class="btns">
        <label><span data-i18n="gallery">Из галереи</span><input id="gallery" type="file" accept="image/*,application/pdf" multiple hidden></label>
        <label class="alt"><span data-i18n="file">Файлом (фото или PDF)</span><input id="fileIn" type="file" accept="image/jpeg,image/png,image/webp,application/pdf,.pdf" multiple hidden></label>
        <label class="alt"><span data-i18n="camera">Камера</span><input id="camera" type="file" accept="image/*" capture="environment" hidden></label>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <div class="row" style="justify-content:center;margin-top:14px;gap:16px">
        <label style="background:none;color:var(--mute);font-weight:400;padding:0"><input type="radio" name="mode" value="replace" checked> <span data-i18n="replace">заменить меню</span></label>
        <label style="background:none;color:var(--mute);font-weight:400;padding:0"><input type="radio" name="mode" value="append"> <span data-i18n="append">добавить к меню</span></label>
      </div>
      <div style="margin-top:14px"><button id="recBtn" class="main" style="padding:10px 22px" disabled data-i18n="recognize">Распознать меню</button></div>
      <div id="recStatus" style="margin-top:10px"></div>
    </div>
    <table id="menuTable"></table>
  </section>

  <!-- ПАМЯТЬ -->
  <section id="mem" class="tab">
    <p><small data-i18n="mem_hint">Эти факты читает каждый агент перед работой: адрес, часы работы, средний чек, поставщики, цели.</small></p>
    <div class="taskbox">
      <input type="text" id="factText" data-i18n-ph="fact_ph" placeholder="">
      <button id="factBtn" class="main" data-i18n="remember">Запомнить</button>
    </div>
    <div id="facts"></div>
  </section>

  <!-- ИСТОРИЯ -->
  <section id="hist" class="tab"><div id="history"></div></section>
</main>

<script>
const $ = s => document.querySelector(s);
// простой и безопасный Markdown: сначала экранируем HTML, потом размечаем
function md(text){
  const inline = t => t
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<em>$2</em>");
  const lines = esc(text).split("\n"), out = [];
  let list = null, para = [];
  const flushP = () => { if (para.length) { out.push("<p>" + inline(para.join("<br>")) + "</p>"); para = []; } };
  const flushL = () => { if (list) { out.push(`<${list.t}>` + list.items.map(i => "<li>" + inline(i) + "</li>").join("") + `</${list.t}>`); list = null; } };
  const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i], tl = l.trim();
    let m;
    if (/^\|.*\|$/.test(tl) && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i+1].trim())) {
      flushP(); flushL();
      const head = cells(tl); i += 1; const rows = [];
      while (i + 1 < lines.length && /^\|.*\|?$/.test(lines[i+1].trim()) && lines[i+1].trim()) rows.push(cells(lines[++i]));
      out.push("<table><tr>" + head.map(h => "<th>" + inline(h) + "</th>").join("") + "</tr>" +
        rows.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</table>");
    } else if ((m = tl.match(/^(#{1,4})\s+(.*)/))) { flushP(); flushL(); const n = Math.min(m[1].length, 3); out.push(`<h${n}>${inline(m[2])}</h${n}>`); }
    else if (/^(-{3,}|\*{3,}|_{3,})$/.test(tl)) { flushP(); flushL(); out.push("<hr>"); }
    else if ((m = tl.match(/^[-*•]\s+(.*)/))) { flushP(); if (!list || list.t !== "ul") { flushL(); list = {t:"ul", items:[]}; } list.items.push(m[1]); }
    else if ((m = tl.match(/^\d+[.)]\s+(.*)/))) { flushP(); if (!list || list.t !== "ol") { flushL(); list = {t:"ol", items:[]}; } list.items.push(m[1]); }
    else if (!tl) { flushP(); flushL(); }
    else { flushL(); para.push(tl); }
  }
  flushP(); flushL();
  return out.join("");
}
function copyBtn(){ return `<button class="copy" onclick="navigator.clipboard.writeText(this.parentElement.querySelector('.md').innerText);this.textContent='${t("copied")}'">${t("copy")}</button>`; }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let AG = {};

// ---------- вкладки ----------
document.querySelectorAll("nav button[data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button[data-tab]").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === b.dataset.tab));
  if (b.dataset.tab === "menu") loadMenu();
  if (b.dataset.tab === "sales") loadSales();

// ---------- продажи ----------
function findRows(o, depth=0){
  if (depth > 4 || o == null) return null;
  if (Array.isArray(o)) return o.length && typeof o[0] === "object" ? o : null;
  if (typeof o === "object") {
    for (const k of ["data","rows","days","groups","items","results"]) { const r = findRows(o[k], depth+1); if (r) return r; }
    for (const v of Object.values(o)) { const r = findRows(v, depth+1); if (r) return r; }
  }
  return null;
}
function flat(row){
  const out = {};
  for (const [k, v] of Object.entries(row || {})) {
    if (v && typeof v === "object" && !Array.isArray(v)) for (const [k2, v2] of Object.entries(v)) out[k + "." + k2] = (v2 && typeof v2 === "object") ? JSON.stringify(v2) : v2;
    else out[k] = Array.isArray(v) ? JSON.stringify(v).slice(0, 80) : v;
  }
  return out;
}
const num = v => { const n = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : null; };
const fmt = n => n == null ? "—" : Math.round(n).toLocaleString("ru-RU");
function table(rows, max=60){
  const fr = rows.slice(0, max).map(flat), cols = [...new Set(fr.flatMap(r => Object.keys(r)))].slice(0, 12);
  return `<div class="md"><table><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${fr.map(r => `<tr>${cols.map(c => `<td>${esc(r[c] ?? "")}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
const pickKey = (keys, re, row) => keys.find(k => re.test(k) && num(row[k]) != null);
async function loadSales(){
  const box = $("#salesBox"); box.innerHTML = `<small>${t("loading")}</small>`;
  let d;
  try { const r = await fetch("/api/sales?days=" + $("#salesDays").value); d = await r.json(); if (!r.ok) throw new Error(d.detail); }
  catch (e) { box.innerHTML = `<div class="card err">${t("error")}: ${esc(e.message)}</div>`; return; }
  if (!d.connected) { box.innerHTML = t("sales_off"); return; }
  let html = "";
  const daily = findRows(d.daily);
  if (daily) {
    const fr = daily.map(flat), keys = Object.keys(fr[0] || {});
    const dk = keys.find(k => /date|day/i.test(k)), vk = pickKey(keys, /net|revenue|total|sum|amount|sales/i, fr[0]), ok = pickKey(keys, /order|receipt|check|count/i, fr[0]);
    if (vk) {
      const vals = fr.map(r => num(r[vk]) || 0), max = Math.max(...vals, 1), sum = vals.reduce((a, b) => a + b, 0);
      const orders = ok ? fr.reduce((a, r) => a + (num(r[ok]) || 0), 0) : null, active = vals.filter(v => v > 0).length;
      html += `<div class="kpis"><div class="kpi"><small>${t("k_rev")}</small><b>${fmt(sum)} ₸</b></div>
        <div class="kpi"><small>${t("k_avg")}</small><b>${fmt(active ? sum / active : 0)} ₸</b></div>
        ${orders != null ? `<div class="kpi"><small>${t("k_orders")}</small><b>${fmt(orders)}</b></div>` : ""}
        <div class="kpi"><small>${t("k_days")}</small><b>${active}</b></div></div>
        <div class="card"><h3>${t("t_daily")}</h3><div class="bars">${fr.map((r, i) => `<div class="bar" style="height:${Math.max(2, vals[i] / max * 100)}%" data-t="${esc(dk ? r[dk] : i + 1)}: ${fmt(vals[i])} ₸"></div>`).join("")}</div></div>`;
    }
    html += `<details class="card"><summary>${t("t_daily")} — ${t("tbl")}</summary>${table(daily, 100)}</details>`;
  }
  const items = findRows(d.by_item); if (items) html += `<div class="card"><h3>${t("t_items")}</h3>${table(items, 40)}</div>`;
  const week = findRows(d.by_weekday); if (week) html += `<div class="card"><h3>${t("t_week")}</h3>${table(week, 7)}</div>`;
  if (d.errors?.length) html += `<div class="card err">${d.errors.map(esc).join("<br>")}</div>`;
  if (!html) html = `<div class="card"><pre style="white-space:pre-wrap">${esc(JSON.stringify(d, null, 2)).slice(0, 5000)}</pre></div>`;
  box.innerHTML = html;
}
$("#salesBtn").onclick = loadSales; $("#salesDays").onchange = loadSales;

let waPhone = null, waTimer = null;
async function loadWA(){
  let d; try { d = await (await fetch("/api/wa/chats")).json(); } catch { return; }
  $("#waSetup").innerHTML = d.connected ? "" : t("wa_off")(location.origin + "/webhook/whatsapp");
  $("#waAuto").checked = d.autoreply;
  $("#waList").innerHTML = d.chats.map(c => `<div class="wa-item ${c.phone === waPhone ? "on" : ""}" data-p="${esc(c.phone)}">
    <b>${esc(c.name || "+" + c.phone)}</b><small>${esc(c.last || "")}</small><small>${esc((c.time || "").replace("T", " ").slice(0, 16))}</small></div>`).join("")
    || `<div class="wa-item"><small>—</small></div>`;
  document.querySelectorAll(".wa-item[data-p]").forEach(e => e.onclick = () => openChat(e.dataset.p));
  if (waPhone) openChat(waPhone, true);
  clearTimeout(waTimer);
  if (document.querySelector("nav button.on[data-tab]")?.dataset.tab === "wa") waTimer = setTimeout(loadWA, 8000);
}
async function openChat(phone, quiet){
  waPhone = phone;
  document.querySelectorAll(".wa-item").forEach(e => e.classList.toggle("on", e.dataset.p === phone));
  renderMsgs(await (await fetch("/api/wa/history?phone=" + encodeURIComponent(phone))).json(), quiet);
}
function renderMsgs(list, quiet){
  const box = $("#waMsgs"), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = list.map(m => `<div class="msg ${m.direction}">${esc(m.text)}<small>${m.direction === "in" ? t("you") : esc(m.author === "ИИ" ? t("ai") : m.author === "менеджер" ? t("manager") : m.author || "")} · ${esc((m.created || "").slice(11, 16))}</small></div>`).join("");
  if (!quiet || atBottom) box.scrollTop = box.scrollHeight;
}
async function waSend(){
  const text = $("#waText").value.trim(); if (!text || !waPhone) return;
  $("#waSend").disabled = true;
  try {
    const r = await fetch("/api/wa/reply", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({phone: waPhone, text})});
    const d = await r.json(); if (!r.ok) throw new Error(d.detail);
    $("#waText").value = ""; renderMsgs(d);
  } catch (e) { alertBox(e.message); }
  $("#waSend").disabled = false;
}
function alertBox(msg){ $("#waIdeas").innerHTML = `<div class="card err">${t("error")}: ${esc(msg)}</div>`; }
$("#waSend").onclick = waSend;

  buyer:     {x:600, y:420, w:300, h:300, door:"t", floor:"#3a3426"},
  director:  {x:900, y:0,   w:300, h:720, door:"l", floor:"#4a2f22"},
};
const LOOK = {
  director:  {shirt:"#1f2b48", pants:"#1b1b1f", hair:"#2b1d14", skin:"#e8b98f"},
  marketer:  {shirt:"#e2574c", pants:"#2d3a55", hair:"#6b3b1e", skin:"#f1c7a1"},
  financier: {shirt:"#2e8b57", pants:"#2b2b2b", hair:"#111",    skin:"#d9a27b"},
  accountant:{shirt:"#7b68c9", pants:"#37323f", hair:"#a0522d", skin:"#f3cfb0"},
  chef:      {shirt:"#f4f4f4", pants:"#333",    hair:"#3d2a1c", skin:"#e0ac84"},
  smm:       {shirt:"#ff5fa2", pants:"#20304a", hair:"#e8c35a", skin:"#f6d2b6"},
  hr:        {shirt:"#3fa7d6", pants:"#3b3b3b", hair:"#2a1a10", skin:"#c98d64"},
  buyer:     {shirt:"#e39b2d", pants:"#4a4232", hair:"#5a4030", skin:"#e9bb94"},
};
// место за столом: x, y (ноги), dir — куда смотрит (1 вправо, -1 влево)
function seatOf(k){
  const r = ROOMS[k];
  if (k === "director") return {x:1125, y:420, dir:-1};
  return r.y === 0 ? {x:r.x+55, y:245, dir:1} : {x:r.x+80, y:655, dir:1};
}
const VISIT = [962, 420];             // где стоит сотрудник у стола директора
const BOARD = [1040, 190];             // где директор пишет на доске
const COFFEE = [92, 384];              // кофемашина в коридоре
function doorPath(k){ const r = ROOMS[k], cx = r.x + r.w/2; return [[cx, r.y===0 ? r.y+r.h-28 : r.y+28], [cx, 362]]; }
function toDirector(k){ return [...doorPath(k), [880,362], [935,380], VISIT]; }
function homeFrom(pathTo, k){ const s = seatOf(k); return [...pathTo.slice(0,-1).reverse(), [s.x, s.y]]; }

const P = {};          // человечки
const MON = {};        // мониторы
let deskPapers;        // стопка бумаг на столе директора

function el(cls, css, html=""){ const d = document.createElement("div"); d.className = cls; Object.assign(d.style, css); d.innerHTML = html; return d; }
function decor(f, e, x, y, size=26, z){ f.appendChild(el("decor", {left:x+"px", top:y+"px", fontSize:size+"px", zIndex:z ?? Math.round(y+size)}, e)); }

function buildOffice(){
  const f = $("#floor"); f.innerHTML = "";
  f.appendChild(el("corridor", {}));
  for (const [k, r] of Object.entries(ROOMS)) {
    const room = el("room", {left:r.x+"px", top:r.y+"px", width:r.w+"px", height:r.h+"px", background:r.floor});
    const pl = el("plate", {}, ""); pl.dataset.nameK = k; pl.dataset.emoji = (AG[k]?.emoji || "") + " "; pl.textContent = pl.dataset.emoji + NAME(k);
    room.appendChild(pl);
    f.appendChild(room);
    const cx = r.x + r.w/2;
    if (r.door === "b") f.appendChild(el("door b", {left:(cx-32)+"px", top:(r.y+r.h-5)+"px", width:"64px", height:"5px"}));
    if (r.door === "t") f.appendChild(el("door t", {left:(cx-32)+"px", top:r.y+"px", width:"64px", height:"5px"}));
    if (r.door === "l") f.appendChild(el("door l", {left:r.x+"px", top:"330px", width:"5px", height:"64px"}));
    // стол, стул, монитор
    const s = seatOf(k), big = k === "director", dw = big ? 120 : 100;
    const dl = s.dir === 1 ? s.x + 14 : s.x - 14 - dw;
    const desk = el("desk", {left:dl+"px", top:(s.y-36)+"px", width:dw+"px", zIndex:s.y+3},
      `<div class="top"></div><div class="lg a"></div><div class="lg z"></div>`);
    const mon = el("mon", {left:(s.dir===1 ? 10 : dw-46)+"px"}); desk.appendChild(mon); MON[k] = mon;
    if (big) { deskPapers = el("papers", {left:"60px"}, ""); desk.appendChild(deskPapers); }
    f.appendChild(desk);
    f.appendChild(el("chair " + (s.dir===1 ? "r" : "l"), {left:(s.dir===1 ? s.x-24 : s.x-6)+"px", top:(s.y-40)+"px", zIndex:s.y-2}));
  }
  // обстановка кабинетов
  decor(f,"🪴",180,235,30); decor(f,"📣",150,60,30); f.appendChild(el("wallart",{left:"20px",top:"40px",width:"110px",height:"60px",background:"#ffcf3f",zIndex:5,font:"800 20px system-ui",color:"#c0392b",display:"flex",alignItems:"center",justifyContent:"center"},"SALE %"));
  f.appendChild(el("wallart",{left:"245px",top:"40px",width:"120px",height:"70px",background:"#f4f4f0",zIndex:5},
    `<svg width="120" height="70"><polyline points="8,60 30,45 52,50 74,28 96,32 114,10" fill="none" stroke="#2e8b57" stroke-width="4"/></svg>`));
  decor(f,"🪙",395,230,24); decor(f,"🗄️",610,50,40); decor(f,"🧮",470,60,30); decor(f,"📚",530,60,30);
  decor(f,"🍳",800,40,36); decor(f,"🥘",845,95,28); decor(f,"🔪",700,60,26); decor(f,"🧅",855,240,22);
  decor(f,"💡",230,470,34); decor(f,"📸",200,560,34); decor(f,"🤳",30,470,30);
  decor(f,"🛋️",480,470,48); decor(f,"🪴",560,640,32); decor(f,"🗂️",330,470,30);
  decor(f,"📦",820,470,34); decor(f,"📦",850,500,34); decor(f,"📦",815,520,34); decor(f,"🛒",640,470,34); decor(f,"📋",740,470,26);
  f.appendChild(el("window",{left:"1150px",top:"200px",width:"30px",height:"140px"}));
  f.appendChild(el("board",{},"ПЛАН НЕДЕЛИ<br>· выручка ↑<br>· новое меню"));
  decor(f,"🏆",1150,420,26); decor(f,"🪴",930,640,40); decor(f,"📚",1120,600,44); decor(f,"🌐",1000,620,30);
  decor(f,"☕",40,318,34,330); decor(f,"🚰",8,322,32,330); decor(f,"🪴",860,318,30,330);

  // человечки
  for (const k of Object.keys(ROOMS)) {
    const L = LOOK[k];
    const p = el("person", {"--shirt":L.shirt, "--pants":L.pants, "--hair":L.hair, "--skin":L.skin});
    p.style.setProperty("--shirt", L.shirt); p.style.setProperty("--pants", L.pants);
    p.style.setProperty("--hair", L.hair); p.style.setProperty("--skin", L.skin);
    p.innerHTML = `<div class="bubble"></div><div class="tag" data-name-k="${k}">${esc(NAME(k))}</div>
      <div class="pi"><div class="pb">
        <div class="arm b"></div><div class="leg b"></div><div class="torso"></div><div class="leg f"></div>
        <div class="head"><div class="hair"></div><div class="eye"></div></div><div class="arm f"></div><div class="carry">📁</div>
      </div></div>`;
    f.appendChild(p);
    P[k] = {k, el:p, x:0, y:0, chain:Promise.resolve(), state:"idle", trip:false};
    sitAt(P[k]);
  }
  fit();
}

function fit(){ const w = $("#office"), s = w.clientWidth / W; $("#floor").style.transform = `scale(${s})`; w.style.height = (H*s) + "px"; }
window.addEventListener("resize", fit);

const sleep = ms => new Promise(r => setTimeout(r, ms));
function setPos(p, x, y){ p.x = x; p.y = y; p.el.style.left = (x-20)+"px"; p.el.style.top = (y-76)+"px"; p.el.style.zIndex = Math.round(y); }
function face(p, d){ p.el.classList.toggle("left", d < 0); }
function sitAt(p){ const s = seatOf(p.k); setPos(p, s.x, s.y); face(p, s.dir); p.el.classList.remove("walking"); p.el.classList.add("sitting"); }
function poses(p, ...add){ p.el.classList.remove("typing","thinking","writing","giving","waving","stretch"); add.forEach(c => p.el.classList.add(c)); }
// выполнить действие строго после предыдущих действий этого человечка
function act(p, fn){ return p.chain = p.chain.then(fn).catch(console.error); }
function walk(p, pts){
  return act(p, () => new Promise(res => {
    poses(p); p.el.classList.remove("sitting"); p.el.classList.add("walking");
    let i = 0, last = performance.now();
    const step = t => {
      const dt = Math.min((t - last) / 1000, .05); last = t;
      const [tx, ty] = pts[i], dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy), v = SPEED * dt;
      if (Math.abs(dx) > 1.5) face(p, dx);
      if (d <= v) { setPos(p, tx, ty); if (++i >= pts.length) { p.el.classList.remove("walking"); return res(); } }
      else setPos(p, p.x + dx/d*v, p.y + dy/d*v);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }));
}
function say(k, text, ms=2800){
  const p = P[k], b = p.el.querySelector(".bubble");
  b.textContent = text.length > 120 ? text.slice(0,120)+"…" : text; b.classList.add("show");
  b.style.transform = `translateX(${p.x > 1040 ? -88 : p.x < 110 ? -15 : -50}%)`;
  p.el.style.zIndex = 2000; clearTimeout(b._t);
  b._t = setTimeout(() => { b.classList.remove("show"); p.el.style.zIndex = Math.round(p.y); }, ms);
}
const mon = (k, on) => MON[k]?.classList.toggle("on", on);

// живая жизнь в офисе, пока нет задач
setInterval(() => {
  if (busy) return;
  for (const p of Object.values(P)) {
    if (p.state !== "idle" || p.trip || !p.el.classList.contains("sitting")) continue;
    const r = Math.random();
    if (p.k !== "director" && r < .06) coffeeTrip(p);
    else if (r < .30) { poses(p, "typing"); mon(p.k, true); setTimeout(() => { if (p.state==="idle") { poses(p); mon(p.k, false); } }, 2500); }
    else if (r < .38) { poses(p, "thinking"); setTimeout(() => p.state==="idle" && poses(p), 1800); }
    else if (r < .42) { poses(p, "stretch"); setTimeout(() => p.state==="idle" && poses(p), 1200); }
  }
}, 2200);
function coffeeTrip(p){
  p.trip = true;
  const go = [...doorPath(p.k), COFFEE];
  walk(p, go);
  act(p, async () => { face(p, -1); say(p.k, t("s_coffee"), 2000); await sleep(2200); });
  walk(p, homeFrom(go, p.k));
  act(p, async () => { sitAt(p); p.trip = false; });
}

// очередь событий — чтобы анимация шла по порядку
let queue = Promise.resolve();
const enqueue = fn => queue = queue.then(fn).catch(console.error);

async function handle(ev){
  const R = $("#results"), p = P[ev.agent], D = P.director;
  switch (ev.type) {
    case "status":
      if (!p) break;
      p.state = ev.state;
      if (ev.state === "working") await act(p, async () => { sitAt(p); poses(p, "typing"); mon(p.k, true); say(p.k, t("s_work") + ev.text, 3500); await sleep(400); });
      else if (ev.state === "thinking") await act(p, async () => { poses(p, "thinking"); say(p.k, /итог/i.test(ev.text) ? t("s_sum") : t("s_read")); await sleep(900); });
      else await act(p, async () => { poses(p); mon(p.k, false); });
      break;
    case "plan": {
      const names = ev.assignments.map(a => NAME(a.agent));
      await walk(D, [[1060, 330], BOARD]);
      await act(D, async () => {
        face(D, 1); poses(D, "writing");
        document.querySelector(".board").innerHTML = "<b>" + t("s_board") + "</b><br>" + names.map(n => "→ " + esc(n)).join("<br>");
        say("director", ev.text || t("s_plan"), 3000); await sleep(2200); poses(D);
      });
      await walk(D, [[1060, 330], [seatOf("director").x, seatOf("director").y]]);
      await act(D, async () => { sitAt(D); say("director", t("s_wait") + names.join(", "), 2500); });
      break;
    }
    case "move": {
      const go = toDirector(ev.agent);
      await act(p, async () => { poses(p); mon(p.k, false); });
      await walk(p, go);
      await act(p, async () => {
        face(p, 1); poses(D, "giving"); say("director", t("s_give"), 2000); await sleep(1100);
        poses(D); p.el.classList.add("carrying"); say(p.k, t("s_take"), 1500); await sleep(700);
      });
      await walk(p, homeFrom(go, ev.agent));
      await act(p, async () => { p.el.classList.remove("carrying"); sitAt(p); });
      break;
    }
    case "result": {
      const go = toDirector(ev.agent);
      await act(p, async () => { poses(p, "stretch"); mon(p.k, false); say(p.k, t("s_done"), 1500); await sleep(800); p.el.classList.add("carrying"); });
      await walk(p, go);
      await act(p, async () => {
        face(p, 1); poses(p, "giving"); await sleep(700);
        p.el.classList.remove("carrying"); poses(p); deskPapers.textContent += "📄";
        say("director", t("s_thanks"), 1800); await sleep(800);
      });
      R.insertAdjacentHTML("beforeend", `<div class="card"><h3>${AG[ev.agent].emoji} ${esc(NAME(ev.agent))}</h3>
        ${copyBtn()}<div class="task">${t("task")}: ${esc(ev.task)}</div><div class="md">${md(ev.text)}</div></div>`);
      walk(p, homeFrom(go, ev.agent));
      act(p, async () => sitAt(p));
      break;
    }
    case "summary":
      await act(D, async () => { D.el.classList.remove("sitting"); poses(D, "waving"); deskPapers.textContent = ""; say("director", t("s_final"), 3500); await sleep(1800); poses(D); sitAt(D); });
      R.insertAdjacentHTML("afterbegin", `<div class="card summary">${copyBtn()}<h3>👔 ${t("summary")}</h3><div class="md">${md(ev.text)}</div></div>`);
      break;
    case "error":
      R.insertAdjacentHTML("afterbegin", `<div class="card err">${t("error")}: ${esc(ev.text)}</div>`);
      Object.values(P).forEach(x => { x.state = "idle"; poses(x); mon(x.k, false); });
      break;
  }
}

let busy = false;
async function sendTask(){
  const text = $("#taskText").value.trim(); if (!text || busy) return;
  busy = true; $("#sendBtn").disabled = true; $("#results").innerHTML = "";
  try {
    const res = await fetch("/api/task", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text, lang: LANG})});
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let i; while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0,i).trim(); buf = buf.slice(i+1);
        if (line) { const ev = JSON.parse(line); enqueue(() => handle(ev)); }
      }
    }
  } catch (e) { enqueue(() => handle({type:"error", text:e.message})); }
  enqueue(() => { busy = false; $("#sendBtn").disabled = false; });
}
$("#sendBtn").onclick = sendTask;
$("#taskText").addEventListener("keydown", e => { if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendTask(); }});

// ---------- меню ----------
let picked = [];
function pick(files){
  const isPdf = f => f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  picked = [...picked, ...[...files].filter(f => f.type.startsWith("image/") || isPdf(f))];
  $("#thumbs").innerHTML = picked.map(f => isPdf(f)
    ? `<div style="width:90px;height:90px;border-radius:8px;background:#33251c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;padding:4px;text-align:center;overflow:hidden"><span style="font-size:30px">📄</span>${esc(f.name.slice(0, 24))}</div>`
    : `<img src="${URL.createObjectURL(f)}">`).join("");
  $("#recBtn").disabled = !picked.length;
}
["#gallery","#fileIn","#camera"].forEach(s => $(s).onchange = e => pick(e.target.files));
const drop = $("#drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files); };

async function shrink(file){ // уменьшаем фото до 2000px, чтобы быстро отправлялось; PDF отправляем как есть
  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) return file;
  const img = await createImageBitmap(file); const k = Math.min(1, 2000/Math.max(img.width,img.height));
  const c = document.createElement("canvas"); c.width = img.width*k; c.height = img.height*k;
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return new Promise(r => c.toBlob(b => r(new File([b], file.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"})), "image/jpeg", .88));
}
$("#recBtn").onclick = async () => {
  $("#recBtn").disabled = true; $("#recStatus").textContent = t("rec_wait");
  const fd = new FormData();
  for (const f of picked) fd.append("files", await shrink(f));
  fd.append("mode", document.querySelector("input[name=mode]:checked").value);
  try {
    const r = await fetch("/api/menu/upload", {method:"POST", body:fd}); const d = await r.json();
    if (!r.ok) throw new Error(d.detail);
    $("#recStatus").textContent = t("rec_ok") + d.recognized;
    picked = []; $("#thumbs").innerHTML = ""; renderMenu(d.menu);
  } catch(e){ $("#recStatus").innerHTML = `<span class="err">${esc(e.message)}</span>`; $("#recBtn").disabled = false; }
};
async function loadMenu(){ renderMenu(await (await fetch("/api/menu")).json()); }
function renderMenu(m){
  $("#menuTable").innerHTML = m.length ? `<tr><th>${t("m_cat")}</th><th>${t("m_dish")}</th><th>${t("m_desc")}</th><th style="text-align:right">${t("m_price")}</th></tr>` +
    m.map(i => `<tr><td>${esc(i.category)}</td><td>${esc(i.name)}</td><td><small>${esc(i.description)}</small></td>
      <td class="price">${i.price!=null ? Math.round(i.price).toLocaleString("ru-RU")+" ₸" : "—"}</td></tr>`).join("")
    : `<tr><td><small>${t("m_empty")}</small></td></tr>`;
}

// ---------- память ----------
async function loadFacts(){ renderFacts(await (await fetch("/api/memory")).json()); }
function renderFacts(f){
  $("#facts").innerHTML = f.map(x => `<div class="card fact"><span>${esc(x.text)}</span><button title="Удалить" data-id="${x.id}">✕</button></div>`).join("");
  $("#facts").querySelectorAll("button").forEach(b => b.onclick = async () =>
    renderFacts(await (await fetch("/api/memory/"+b.dataset.id, {method:"DELETE"})).json()));
}
$("#factBtn").onclick = async () => {
  const text = $("#factText").value.trim(); if (!text) return;
  renderFacts(await (await fetch("/api/memory", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text})})).json());
  $("#factText").value = "";
};

// ---------- история ----------
async function loadHistory(){
  const h = await (await fetch("/api/history")).json();
  $("#history").innerHTML = h.length ? h.map(t => `<div class="card"><h3>${esc(t.text)}</h3><div class="task">${esc(t.created.replace("T"," "))}</div>
    <div class="md">${md(t.result.summary || "")}</div></div>`).join("") : `<small>${t("hist_empty")}</small>`;
}

// ---------- старт ----------
(async () => {
  const r = await fetch("/api/info"); if (r.status === 401) { location.href = "/login"; return; }
  const i = await r.json(); AG = i.agents;
  INFO = i; setBadge();
  if (i.demo) $("#mode").classList.add("demo");
  buildOffice(); applyLang();
})();
